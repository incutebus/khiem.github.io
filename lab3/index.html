<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up Page</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<h1>Sign Up Form</h1>

<form id="signupForm" action="welcome.html">

  <div class="row">
    <label for="fName">First Name:</label>
    <input type="text" id="fName" name="fName">
  </div>

  <div class="row">
    <label for="lName">Last Name:</label>
    <input type="text" id="lName" name="lName">
  </div>

  <div class="row">
    <label>Gender:</label>
    <label class="radio"><input type="radio" name="gender" value="m"> Male</label>
    <label class="radio"><input type="radio" name="gender" value="f"> Female</label>
  </div>

  <div class="row">
    <label for="zip">Zip Code:</label>
    <input type="text" id="zip" name="zip">
    <span id="zipError"></span>
  </div>

  <div class="info">
    City: <span id="city"></span><br>
    Latitude: <span id="latitude"></span><br>
    Longitude: <span id="longitude"></span>
  </div>

  <div class="row">
    <label for="state">State:</label>
    <select id="state" name="state">
      <option value="">Loading states...</option>
    </select>
  </div>

  <div class="row">
    <label for="county">Select a County:</label>
    <select id="county" name="county"></select>
  </div>

  <div class="row">
    <label for="username">Desired Username:</label>
    <input type="text" id="username" name="username">
    <span id="usernameError"></span>
  </div>

  <div class="row">
    <label for="password">Password:</label>
    <input type="password" id="password" name="password">
    <span id="suggestedPwd"></span>
  </div>

  <div class="row">
    <label for="passwordAgain">Type Password Again:</label>
    <input type="password" id="passwordAgain" name="passwordAgain">
  </div>

  <p id="passwordError"></p>

  <button>Sign up!</button>
</form>

<footer>Khiem Vo - CST336 - Professor Lara - API Lab</footer>

<script src="js/script.js"></script>
</body>
</html>
